<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Times tables practice for kids, played as a race around a circuit. Works offline, no account, no ads, no tracking.">
<meta name="theme-color" content="#0d1428">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Math Racer">
<title>Math Fact Racer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* ------------------------------------------------------------------ *
 * Math Fact Racer - stylesheet
 *
 * The visual world is deliberately a single bright one (an illustrated
 * race track). Every colour is set explicitly so the page holds up in
 * both light and dark host themes.
 * ------------------------------------------------------------------ */

:root{
  color-scheme: light;
  --ink:#182543;
  --ink-soft:#4a5a80;
  --ink-faint:#8a97b5;
  --paper:#ffffff;
  --shell:#eef2fb;
  --shell-2:#dfe6f7;
  --line:#cdd7ee;

  --grape:#5b4bd6;
  --grape-dark:#42349f;
  --grape-soft:#ece9ff;
  --mint:#12b36a;
  --mint-dark:#0c8a51;
  --sun:#ffb020;
  --sun-dark:#d98b00;
  --berry:#f2557f;
  --berry-soft:#ffe6ed;
  --sky:#38b6ff;

  --r-s:10px; --r-m:16px; --r-l:24px; --r-xl:32px;
  --shadow:0 6px 0 rgba(24,37,67,.16);
  --shadow-soft:0 8px 24px rgba(24,37,67,.12);
  --font-display:"Baloo 2", ui-rounded, "SF Pro Rounded", "Segoe UI Variable Display", system-ui, sans-serif;
  --font-body:"Nunito", ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif;
  --safe-b: env(safe-area-inset-bottom, 0px);

  /* How wide the game itself is allowed to be. A phone is the measure;
     a tablet held upright gets a little more, and a window on its side
     gets the lot, because that is where the screen is worth using. The
     two values behind data-w and data-o are written on <html> by
     layoutClass(), not by a media query, so the map can read the same
     decision. */
  --appw:520px;
}
html[data-w="tablet"],html[data-w="desk"]{--appw:720px}
html[data-o="wide"]{--appw:none}

/* How big the letters are for the child at the screen. One scale that
   every child-facing size multiplies, written on <html> by render() as
   data-grade, so a first year reads the same screen in larger type than
   a fourth year does. The parent section and a screen with no profile
   behind it stay at 1, and so do the uppercase labels and the heatmap,
   which are read by a grown up. These numbers are the whole tuning
   knob: they are estimates to be checked on a child, and this is the one
   place to change them. The fifth year is written down before it exists,
   so that switching it on cannot silently drop the scale back to 1.
   app.js carries the same table as TX_BY_GRADE, because the height of a
   map card depends on it and JS cannot read a custom property without a
   layout; tests/style.test.js checks the two agree. */
html{--tx:1}
html[data-grade="1"]{--tx:1.25}
html[data-grade="2"]{--tx:1.12}
html[data-grade="3"]{--tx:1.04}
html[data-grade="4"]{--tx:1}
html[data-grade="5"]{--tx:1}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;
  background:var(--shell);
  color:var(--ink);
  font-family:var(--font-body);
  font-weight:600;
  overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;
}
button{font-family:inherit;font-weight:800;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--grape);outline-offset:2px}
input{font-family:inherit}

#app{
  position:relative;
  width:100%;
  max-width:var(--appw);
  margin:0 auto;
  /* vh first as the fallback, dvh last so it wins where it is understood;
     the other way round iOS Safari kept vh and hid the bottom row of the
     keypad under the browser bar */
  min-height:100vh;
  min-height:100dvh;
  background:var(--shell);
  display:flex;flex-direction:column;
  overflow:hidden;
}
@media (min-width:560px){
  body{background:#c9d4ee;background-image:radial-gradient(circle at 50% 0%,#e4ebfb,#c1cde9)}
  #app{box-shadow:0 0 60px rgba(24,37,67,.28)}
}

/* ---------- shared building blocks ---------- */
.scr{display:flex;flex-direction:column;flex:1;min-height:0}
.scr-scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(24px + var(--safe-b))}
/* A screen that is text and a list keeps its lines short even when the
   window is wide: a line of reading that runs the whole width of a
   tablet is a line nobody follows. The map, the race, the workshop and
   the garage are not marked narrow, because those are exactly the ones
   that want the room. */
.scr.narrow .scr-scroll{width:100%;max-width:760px;margin:0 auto}
.pad{padding:0 18px}

.topbar{
  display:flex;align-items:center;gap:10px;
  padding:calc(12px + env(safe-area-inset-top,0px)) 14px 12px;
  background:var(--paper);
  border-bottom:2px solid var(--line);
  flex:none;
}
.topbar h1{font-family:var(--font-display);font-size:calc(20px * var(--tx));margin:0;flex:1;letter-spacing:.2px}
.iconbtn{
  width:42px;height:42px;flex:none;border-radius:14px;background:var(--shell);
  display:grid;place-items:center;font-size:19px;color:var(--ink-soft);
  border:2px solid var(--line);
}
.iconbtn:active{transform:translateY(1px)}

.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:15px 20px;border-radius:var(--r-m);
  background:var(--grape);color:#fff;font-size:calc(17px * var(--tx));
  box-shadow:0 4px 0 var(--grape-dark);
  transition:transform .06s, box-shadow .06s;
  font-family:var(--font-display);
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--grape-dark)}
.btn.ghost{background:var(--paper);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn.ghost:active{box-shadow:0 1px 0 var(--line)}
.btn.mint{background:var(--mint);box-shadow:0 4px 0 var(--mint-dark)}
.btn.mint:active{box-shadow:0 1px 0 var(--mint-dark)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}

.card{background:var(--paper);border-radius:var(--r-l);padding:16px;border:2px solid var(--line)}
.h2{font-family:var(--font-display);font-size:calc(17px * var(--tx));margin:22px 0 10px}
.muted{color:var(--ink-soft);font-weight:600;font-size:13.5px;line-height:1.5}
/* The same paragraph read by a child rather than by a parent: bigger to
   start with, and it grows with the school year on top of that. The
   narrow screens are the ones the parent reads, so they keep 13.5. */
.scr:not(.narrow) .muted{font-size:calc(14px * var(--tx))}
.tiny{font-size:calc(12.5px * var(--tx));color:var(--ink-faint);font-weight:700;letter-spacing:.4px;text-transform:uppercase}

/* ---------- player picker ---------- */
.hero{
  padding:calc(32px + env(safe-area-inset-top,0px)) 22px 30px;
  text-align:center;
  background:linear-gradient(168deg,#33288a 0%,#5b4bd6 60%,#7d6ff0 100%);
  color:#ffffff;position:relative;flex:none;
  border-radius:0 0 34px 34px;
  box-shadow:0 8px 22px rgba(51,40,138,.22);
}
.hero h1{font-family:var(--font-display);font-size:34px;margin:0 0 6px;line-height:1.05;
  text-wrap:balance;color:#ffffff;text-shadow:0 2px 8px rgba(28,20,80,.35)}
.hero p{margin:0;font-size:14.5px;color:#e6e1ff;line-height:1.4}

.players{display:flex;flex-direction:column;gap:12px;padding:6px 18px 18px}
.player{
  display:flex;align-items:center;gap:14px;padding:12px 14px;
  background:var(--paper);border-radius:var(--r-l);border:2px solid var(--line);
  box-shadow:var(--shadow-soft);text-align:left;width:100%;
}
.player:active{transform:translateY(2px)}
.player .av{width:56px;height:56px;flex:none;border-radius:18px;background:var(--grape-soft);display:grid;place-items:center;overflow:hidden}
.player .av svg{width:100%;height:100%}
.player .nm{font-family:var(--font-display);font-size:19px;line-height:1.2}
.player .sub{font-size:12.5px;color:var(--ink-soft);font-weight:700}
.player .del{margin-left:auto;color:var(--ink-faint);font-size:18px;padding:8px}

/* ---------- track map ---------- */
/* Five chips do not fit a narrow phone in one line, and a chip pushed
   off the edge is a chip nobody taps, so the row wraps. */
.hud{display:flex;flex-wrap:wrap;gap:8px;padding:12px 18px 4px;flex:none}
/* on its side there is room for all five in one line, and a wrapped row
   would only push the map down */
html[data-o="wide"] .hud{flex-wrap:nowrap}
.chip{
  display:flex;align-items:center;gap:6px;background:var(--paper);
  border:2px solid var(--line);border-radius:999px;padding:7px 13px;
  font-size:calc(14px * var(--tx));font-family:var(--font-display);
}
.chip .em{font-size:15px}
.chip.warm{background:#fff5df;border-color:#ffdc9a;color:#8a5a00}
.chip.fire{background:#ffeadf;border-color:#ffc4a3;color:#a34400}

/* The map is a world: places sit along a winding road instead of
   stacking into a column. Position comes from the markup, computed in
   JS, so the road and the places cannot drift apart; the stylesheet only
   says what a place looks like. */
.world{position:relative;margin:10px 14px 0}
.worldroad{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.place{
  position:absolute;width:44%;max-width:205px;display:flex;flex-direction:column;gap:5px;
  padding:9px;border-radius:var(--r-l);border:2px solid var(--line);
  background:var(--paper);text-align:left;box-shadow:var(--shadow-soft);
}
/* From three columns up the card follows the column count instead of the
   205 px cap measured on a phone. The places stand in rows and are read
   left to right like a page, whatever the number of columns; the road
   comes back to the left edge through the band between two rows. The
   number of columns is decided in JS, because worldSpots() has to know it
   too, and arrives here on the map itself. */
.world[data-cols="3"] .place{width:30.3%;max-width:none}
.world[data-cols="4"] .place{width:22%;max-width:none}
.place:active{transform:translateY(2px)}
.place .thumb{
  width:100%;aspect-ratio:400/205;border-radius:11px;overflow:hidden;position:relative;
  border:2px solid rgba(24,37,67,.12);background:#1a2440;
}
.place .thumb svg{position:absolute;inset:0;width:100%;height:100%}
/* The name of a place is allowed a second line: at the larger scales of
   the first years a name like "Počítání dílků" no longer fits on one, and
   a place whose name is cut in half is a place the child cannot read. A
   third line is clamped away with an ellipsis, and a word longer than the
   card ("Zaokrouhlování", "Kettenrechnen") is broken across the two lines
   rather than sliced at the edge: the clamp only puts an ellipsis where
   there is a line to hide, and a single long word never makes one.
   Two lines is also the number placeHeight() in app.js counts on. */
.place .nm{font-family:var(--font-display);font-size:calc(16px * var(--tx));line-height:1.1;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  text-overflow:ellipsis;overflow-wrap:break-word}
.place .sub{font-size:calc(12.5px * var(--tx));color:var(--ink-soft);font-weight:700;line-height:1.25;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  text-overflow:ellipsis;overflow-wrap:break-word}
.place .bar{height:7px;border-radius:99px;background:var(--shell-2);overflow:hidden}
.place .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--mint),#6ee7a8)}
/* Every line here has a line-height of its own and every optional part a
   known height, because placeHeight() in app.js adds them up to decide how
   far apart two cards stand; a line whose height is left to the font would
   make that sum a guess. */
.place .foot{display:flex;align-items:center;gap:6px;font-size:calc(13px * var(--tx));font-weight:800;
  color:var(--ink-soft);min-height:16px;line-height:1.25}
/* --ink-faint on the shell is about 2.6 : 1, which is fine for a dot or a
   border and not for something a child is meant to read; every child
   facing line therefore stands in --ink-soft. */
.place .tokc{margin-left:auto;font-size:calc(12.5px * var(--tx));color:var(--ink-soft);white-space:nowrap}
/* The door to next year, and what lies behind it. Dashed, because it is
   a look ahead rather than part of the road: nothing here is counted as
   the child's own yet and none of it stays open after the game closes. */
.place.peekdoor{background:linear-gradient(160deg,#eef0ff,#e2e6ff);border-color:#c3c9f5;border-style:dashed}
.place.peekdoor .foot{color:var(--grape-dark)}
.peekthumb{display:grid;place-items:center;font-size:32px;background:#d8ddff !important}
.place.peek{border-style:dashed;opacity:.9}
/* The door back into the earlier years, and the places behind it. The
   door is dashed like the other one, because it is a fold rather than a
   part of this year's road, but papery instead of violet: what is behind
   it already belongs to the child. The places themselves are drawn in
   full for the same reason. */
.place.backdoor{background:linear-gradient(160deg,#fbf7ed,#f2ebdd);border-color:#ddd0b4;border-style:dashed}
.place.backdoor .foot{color:#8a7444}
.backthumb{display:grid;place-items:center;font-size:32px;background:#ece0c8 !important}
.place.past{background:linear-gradient(160deg,#fdfbf6,#f6f1e6);border-color:#e6dcc7}
/* The sign on the road where this year begins. It is the whole point of
   folding the earlier years away, so it stands there whether the door is
   open or shut; it is not a button and nothing happens on it. */
.milestone{position:absolute;transform:translate(-50%,-50%);z-index:1;
  padding:5px 13px;border-radius:999px;border:2px solid var(--line);
  background:var(--paper);box-shadow:var(--shadow-soft);color:var(--ink);
  font-family:var(--font-display);font-size:calc(14px * var(--tx));white-space:nowrap}
.place.locked{filter:grayscale(.85);opacity:.6}
/* two lines like the name and the subtitle above it: the reason a track is
   shut is a hint beside a name the child can already read, and a card of a
   height nobody can predict is a card that lands on its neighbour */
.place.locked .lockmsg{font-size:calc(12.5px * var(--tx));color:var(--ink-soft);font-weight:700;line-height:1.25;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  text-overflow:ellipsis;overflow-wrap:break-word}

/* ---------- race screen ---------- */
.game{position:relative;display:flex;flex-direction:column;flex:1;min-height:0;background:#0d1428}
.stage{position:relative;flex:none;width:100%;aspect-ratio:400/205;max-height:46vh;overflow:hidden;background:#0d1428}
.stage #circuit{position:absolute;inset:0;width:100%;height:100%}
.vig{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 45%,rgba(8,14,32,0) 40%,rgba(8,14,32,.5) 100%)}

.carwrap{position:absolute;left:0;top:0;width:36px;height:36px;z-index:6;
  transform:translate(-50%,-50%);pointer-events:none;will-change:left,top}
.carwrap .spr{position:absolute;inset:0;display:block;transition:transform .12s linear}
.carwrap .spr svg{width:100%;height:100%;overflow:visible}
.carwrap .glow{position:absolute;inset:-14px;border-radius:99px;opacity:0;transition:opacity .25s;
  background:radial-gradient(circle,rgba(80,235,185,.6),rgba(80,235,185,0) 68%)}
.carwrap.boost .glow{opacity:1}
.carwrap.brake .glow{opacity:1;background:radial-gradient(circle,rgba(255,110,150,.55),rgba(255,110,150,0) 68%)}
.carwrap.rivalcar{width:26px;height:26px;z-index:5;opacity:.48;filter:grayscale(.8) brightness(.72)}
.finbadge{
  position:absolute;left:50%;top:14px;transform:translateX(-50%) scale(0);z-index:7;
  font-family:var(--font-display);font-size:calc(14px * var(--tx));color:#0d1428;background:linear-gradient(180deg,#ffe17a,#ffb020);
  border-radius:99px;padding:4px 14px;box-shadow:0 3px 0 rgba(0,0,0,.3);letter-spacing:.6px;
  transition:transform .3s cubic-bezier(.2,1.6,.4,1);
}
.finbadge.on{transform:translateX(-50%) scale(1)}

.gamebar{
  position:absolute;top:0;left:0;right:0;z-index:6;
  display:flex;align-items:center;gap:8px;
  padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;
}
.gamebar .quit{width:34px;height:34px;border-radius:11px;background:rgba(9,16,34,.55);backdrop-filter:blur(4px);display:grid;place-items:center;font-size:15px;color:#fff}
/* The row of dots, one per question. It only grows inside the race bar,
   which is a flex row and where growing means taking the width between
   the quit button and the counter. The workshop puts the same row on a
   screen that is a flex column, and there growing meant swallowing the
   whole height and leaving an empty band above the coins, so the growth
   belongs to the bar, not to the dots. */
.pips{display:flex;gap:2px;justify-content:center;flex-wrap:nowrap;overflow:hidden}
.gamebar .pips{flex:1}
.pip{width:7px;height:7px;flex:none;border-radius:99px;background:rgba(255,255,255,.22);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35)}
.pip.ok{background:#34e39b;box-shadow:none}
.pip.bad{background:#ff6f95;box-shadow:none}
.pip.now{background:#fff;transform:scale(1.3);box-shadow:0 0 8px rgba(255,255,255,.9)}
.gamebar .cnt{
  font-family:var(--font-display);font-size:calc(13px * var(--tx));color:#fff;background:rgba(9,16,34,.55);
  backdrop-filter:blur(4px);border-radius:11px;padding:5px 10px;min-width:54px;text-align:center;
  font-variant-numeric:tabular-nums;letter-spacing:.3px;
}

.combo{
  position:absolute;right:12px;top:calc(46px + env(safe-area-inset-top,0px));z-index:6;
  font-family:var(--font-display);font-size:calc(15px * var(--tx));color:#0f1730;background:linear-gradient(180deg,#ffd166,#ffb020);
  border-radius:10px;padding:3px 10px;box-shadow:0 3px 0 rgba(0,0,0,.28);
  transform:scale(0);transition:transform .22s cubic-bezier(.2,1.6,.4,1);letter-spacing:.5px;
}
.combo.on{transform:scale(1)}

.floaty{
  position:absolute;z-index:7;font-family:var(--font-display);font-size:calc(23px * var(--tx));color:#34e39b;
  text-shadow:0 2px 6px rgba(0,0,0,.55);pointer-events:none;animation:floaty 1s ease-out forwards;
  font-variant-numeric:tabular-nums;
}
.floaty.bad{color:#ff9ab4}
@keyframes floaty{0%{opacity:0;transform:translateY(6px) scale(.8)}20%{opacity:1;transform:translateY(-4px) scale(1.05)}100%{opacity:0;transform:translateY(-46px) scale(1)}}

/* status strip below the track */
.rail{flex:none;display:flex;align-items:center;gap:10px;padding:8px 14px;background:#141f3d;color:#fff}
.rail .num{font-family:var(--font-display);font-size:calc(16px * var(--tx));font-variant-numeric:tabular-nums}
.rail .lap{font-size:calc(12.5px * var(--tx));font-weight:800;letter-spacing:.5px;text-transform:uppercase;opacity:.55}
.rail .gap{margin-left:auto;font-size:calc(12.5px * var(--tx));font-weight:800;padding:4px 10px;border-radius:99px;
  background:rgba(255,255,255,.1);font-variant-numeric:tabular-nums;white-space:nowrap}
.rail .gap.ahead{background:rgba(52,227,155,.2);color:#7cf0c0}
.rail .gap.behind{background:rgba(255,111,149,.18);color:#ffa8bf}

/* The zone is the part of the race screen that gives way, so it is also
   the part that has to be able to scroll: on a 360 x 640 phone a first
   year's keypad and scene leave it about 120 px for a question and a hint
   that want 137, and nothing in the game may be cut off. "safe center"
   keeps the top of the question reachable when it overflows; a browser
   that does not know the keyword drops the whole declaration and falls
   back to the plain "center" above, which is what it does today. */
.qzone{
  flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;padding:12px 18px;background:var(--shell);
  overflow-y:auto;-webkit-overflow-scrolling:touch;
}
.qzone{justify-content:safe center}
.question{
  font-family:var(--font-display);font-size:calc(var(--tx) * clamp(38px,12vw,54px));line-height:1;
  letter-spacing:1px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:12px;
  flex-wrap:wrap;justify-content:center;row-gap:6px;
}
/* A chain of three numbers is a longer line than a single fact, so the
   letters step down rather than the row running off the side of a
   phone; the answer box is allowed to wrap onto a second row as well.
   Nothing is ever cut off: when it will not fit, it moves. */
.question.q-long{font-size:calc(var(--tx) * clamp(30px,8.6vw,44px))}
.question.q-xlong{font-size:calc(var(--tx) * clamp(24px,6.6vw,36px))}
.answerbox{
  min-width:calc(104px * var(--tx));height:60px;border-radius:var(--r-m);background:var(--paper);
  border:3px dashed var(--line);display:flex;align-items:center;justify-content:center;
  padding:0 14px;font-family:var(--font-display);font-size:calc(40px * var(--tx));font-variant-numeric:tabular-nums;
  transition:background .15s,border-color .15s,transform .15s;
}
/* The unit of the answer, standing behind the box the way a child would
   write it in an exercise book. Smaller than the number, because the
   number is what is being worked out and the unit only says what it is
   counted in; it still grows with the year like every other line a child
   reads. */
.question .unit{font-size:calc(26px * var(--tx));color:var(--ink-soft);letter-spacing:0}
.answerbox.filled{border-style:solid;border-color:var(--grape)}
.answerbox.ok{background:#d9f8e8;border-color:var(--mint);color:var(--mint-dark)}
.answerbox.bad{background:var(--berry-soft);border-color:var(--berry);color:#b3325a;animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}45%{transform:translateX(6px)}70%{transform:translateX(-3px)}}
/* a question that is a picture rather than a line of arithmetic */
.qsvg{display:flex;align-items:center}
.qsvg .dial{width:clamp(96px,26vw,132px);height:clamp(96px,26vw,132px);display:block}
.hintline{min-height:38px;text-align:center;font-size:calc(15px * var(--tx));color:var(--ink-soft);line-height:1.35;font-weight:700}
.hintline b{font-family:var(--font-display);font-size:calc(20px * var(--tx));color:var(--ink)}

/* The answering surface. One kind exists so far, the number pad; each
   further one brings its own modifier class, so the layout lives with
   the input element rather than in the screen around it.
   Do not call this pad3: in docs/kurikulum/TEMATA.md that name is taken
   by the input element with three boxes for hundreds, tens and units. */
.keypad{
  flex:none;display:grid;gap:8px;
  padding:8px 14px calc(14px + var(--safe-b));background:var(--shell);
}
.keypad-pad{grid-template-columns:repeat(3,1fr)}
/* The key grows with the letters on it: a larger digit in a key of the
   old height would sit in a box it no longer fits, so the floor of the
   height carries the same scale as the type. */
.key{
  height:clamp(50px,8.6vh,64px);min-height:calc(50px * var(--tx));
  border-radius:var(--r-m);background:var(--paper);
  font-family:var(--font-display);font-size:calc(26px * var(--tx));box-shadow:0 4px 0 var(--line);
  display:grid;place-items:center;font-variant-numeric:tabular-nums;
}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.key.act{background:var(--mint);color:#fff;box-shadow:0 4px 0 var(--mint-dark);font-size:20px}
.key.act:active{box-shadow:0 1px 0 var(--mint-dark)}
.key.del{background:var(--shell-2);box-shadow:0 4px 0 #c3cde5;font-size:22px}
.key.del:active{box-shadow:0 1px 0 #c3cde5}

/* The race on a screen held on its side. A column of scene, strip,
   question and keypad does not fit, and the question zone, which is the
   one part that grows, was the part that got squeezed to nothing. So:
   the scene down the left with the points strip under it, the question
   and the keypad down the right, and the keypad takes whatever height is
   left. sceneSVG() keeps its aspect ratio inside whatever box it is
   given ("xMidYMid meet") and fitBox() puts the car on the road from the
   measured box, so the road is still under the wheels in a box that is
   not 400 : 205; the night blue shows at the sides, which is the colour
   of the race anyway. Never "slice" here: fitBox() takes the smaller of
   the two scales. */
html[data-o="wide"] .game{
  display:grid;
  grid-template-columns:minmax(0,46fr) minmax(0,54fr);
  grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"stage qzone" "stage keypad" "rail keypad";
}
html[data-o="wide"] .stage{grid-area:stage;aspect-ratio:auto;max-height:none;height:100%;min-height:0}
html[data-o="wide"] .rail{grid-area:rail}
html[data-o="wide"] .qzone{grid-area:qzone;padding:10px 14px 4px}
html[data-o="wide"] .keypad{grid-area:keypad;min-height:0;align-self:stretch}
/* the four rows belong to the number pad, not to every answering surface
   that may come later: .keypad is the surface, .keypad-pad is this one
   layout of it */
html[data-o="wide"] .keypad-pad{grid-template-rows:repeat(4,minmax(calc(38px * var(--tx)),1fr))}
/* The floor of a key grows with the digit on it here too, which is what
   step C4 asks for and what the flat 40 px of step C1 took away again.
   It starts lower than the 50 px of a screen held upright, because on its
   side the keypad has half a phone's height to live in: on a 640 x 360
   window the question zone takes 117 px and four rows of the upright
   floor would need 10 px more than the rest. The rows are 1fr, so the
   floor only decides how small a key may get, never how big. */
html[data-o="wide"] .key{height:auto;min-height:calc(38px * var(--tx))}
/* A tablet held upright is wide enough that a full width keypad would
   have keys 160 px across; that is a target nobody misses, and a reach
   nobody wants. */
html[data-w="tablet"][data-o="tall"] .keypad{width:100%;max-width:480px;margin:0 auto}

/* ---------- result screen ---------- */
.result{padding:22px 18px calc(22px + var(--safe-b));text-align:center}
.medal{font-size:78px;line-height:1;animation:pop .55s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{0%{transform:scale(.2) rotate(-25deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.result h2{font-family:var(--font-display);font-size:calc(28px * var(--tx));margin:6px 0 2px;text-wrap:balance}
.statrow{display:flex;gap:10px;margin:18px 0}
.stat{flex:1;background:var(--paper);border:2px solid var(--line);border-radius:var(--r-m);padding:11px 6px}
.stat .v{font-family:var(--font-display);font-size:calc(23px * var(--tx));font-variant-numeric:tabular-nums}
.stat .l{font-size:calc(12.5px * var(--tx));color:var(--ink-soft);font-weight:800;text-transform:uppercase;letter-spacing:.4px}
.factchips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:8px}
.factchip{background:#fff5df;border:2px solid #ffdc9a;color:#8a5a00;border-radius:999px;padding:6px 13px;font-family:var(--font-display);font-size:calc(15px * var(--tx))}
.newthing{background:linear-gradient(160deg,#fff6e0,#ffe7c2);border:2px solid #ffd28a;border-radius:var(--r-l);padding:14px;display:flex;align-items:center;gap:14px;text-align:left;margin-top:16px}
.newthing .pic{width:64px;height:64px;flex:none}
.newthing .pic svg{width:100%;height:100%}

/* ---------- garage / collection ---------- */
/* Three fixed columns made a machine a third of a tablet wide. The cells
   keep a phone's size and the row simply holds more of them, up to a
   width where the eye still takes the row in at once. */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:11px;
  padding:4px 18px 0;max-width:1000px;margin:0 auto}
.item{
  background:var(--paper);border:2px solid var(--line);border-radius:var(--r-m);
  padding:9px 5px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;
}
.item.sel{border-color:var(--grape);background:var(--grape-soft);box-shadow:0 0 0 3px rgba(91,75,214,.16)}
.item .pic{width:100%;aspect-ratio:1;display:grid;place-items:center}
.item .pic svg{width:88%;height:88%}
.item .nm{font-size:calc(12.5px * var(--tx));font-weight:800;text-align:center;line-height:1.15;color:var(--ink-soft)}
.item.locked{background:var(--shell-2);border-style:dashed}
.item.locked .pic{filter:grayscale(1) brightness(1.6) contrast(.35);opacity:.65}
.item .lvl{position:absolute;top:5px;right:6px;font-size:calc(12.5px * var(--tx));font-weight:900;color:var(--sun-dark);background:#fff5df;border-radius:99px;padding:2px 5px}
.xpbar{height:5px;width:80%;border-radius:99px;background:var(--shell-2);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--sun)}

/* ---------- collection of found things ----------
   A whole collection is one drawing, so there is nothing to lay out
   here: the picture keeps its own aspect ratio and simply fills the
   width it is given. */
.tokwrap{background:var(--paper);border:2px solid var(--line);border-radius:var(--r-m);padding:10px 12px}
.toks{display:block;width:100%;height:auto}
.tok{width:22px;height:22px;display:inline-block}
.tokn{color:var(--ink-soft);font-weight:800}
.toknew{margin-left:6px;background:#fff5df;border:2px solid #ffdc9a;color:#8a5a00;
  border-radius:999px;padding:1px 9px;font-size:calc(12.5px * var(--tx));font-weight:800}
.tokcard{margin-top:16px;text-align:left}

/* ---------- parent section ---------- */
.gate{padding:26px 22px;text-align:center}
.pinin{text-align:center;max-width:230px;margin:0 auto 12px;display:block;
  font-family:var(--font-display);font-size:22px;letter-spacing:6px}
.h3{font-family:var(--font-display);font-size:calc(14px * var(--tx));color:var(--ink-soft);margin:16px 0 6px}
.h3:first-child{margin-top:0}
.heatwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.heat{
  display:grid;grid-template-columns:repeat(var(--hc,11),minmax(0,1fr));gap:3px;
  font-variant-numeric:tabular-nums;width:100%;min-width:0;
}
.heat span{
  aspect-ratio:1;min-width:0;border-radius:5px;display:grid;place-items:center;
  font-size:10px;font-weight:800;color:#fff;background:var(--shell-2);overflow:hidden;
}
.heat .hdr{background:transparent;color:var(--ink-faint);font-size:10.5px}
/* A tile carries an example rather than a number, so it needs room for
   a line of text and cannot stay square like a times table cell. */
.heat.strip{grid-template-columns:repeat(var(--hc,4),minmax(48px,1fr));width:auto;min-width:100%}
.heat.strip span{aspect-ratio:auto;min-height:40px;padding:4px 2px;line-height:1.2;align-content:center}
.heat.strip b{display:block;font-size:9.5px;font-weight:800;letter-spacing:-.2px}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:11px;font-weight:700;color:var(--ink-soft)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:4px;vertical-align:-2px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .lab{flex:1}
.row .lab b{display:block;font-family:var(--font-display);font-size:15.5px;font-weight:700}
.row .lab span{font-size:12px;color:var(--ink-soft);font-weight:600}
.sw{width:54px;height:31px;border-radius:99px;background:var(--shell-2);position:relative;flex:none;transition:background .18s}
.sw i{position:absolute;top:3px;left:3px;width:25px;height:25px;border-radius:99px;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:left .18s}
.sw.on{background:var(--mint)}
.sw.on i{left:26px}
.seg{display:flex;background:var(--shell-2);border-radius:var(--r-m);padding:3px;gap:3px}
.seg button{flex:1;padding:9px 4px;border-radius:12px;font-size:14px;color:var(--ink-soft)}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
textarea{width:100%;min-height:90px;border-radius:12px;border:2px solid var(--line);padding:10px;font-size:12px;font-family:ui-monospace,monospace;font-weight:500;-webkit-user-select:text;user-select:text}

/* ---------- bottom sheet ---------- */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(16,24,45,.5);animation:fade .18s}
@keyframes fade{from{opacity:0}}
.sheet .inner{
  width:100%;max-width:520px;background:var(--paper);border-radius:var(--r-xl) var(--r-xl) 0 0;
  padding:22px 20px calc(22px + var(--safe-b));animation:up .26s cubic-bezier(.2,.9,.3,1);
  /* a tall sheet on a phone held sideways has to scroll, never lose its
     title over the top edge */
  max-height:calc(100vh - 8px);
  max-height:calc(100dvh - 8px);
  overflow-y:auto;
}
@keyframes up{from{transform:translateY(100%)}}
.sheet h3{font-family:var(--font-display);font-size:calc(21px * var(--tx));margin:0 0 6px}
.field{width:100%;padding:14px;border-radius:var(--r-m);border:2px solid var(--line);font-size:calc(17px * var(--tx));font-weight:700;-webkit-user-select:text;user-select:text}
.pickgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.pickitem{
  background:var(--shell);border:2px solid var(--line);border-radius:var(--r-m);
  padding:8px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;
}
.pickitem .pic{width:100%;aspect-ratio:1;display:grid;place-items:center}
.pickitem .pic svg{width:92%;height:92%}
.pickitem .nm{font-size:calc(12.5px * var(--tx));font-weight:800;color:var(--ink-soft)}
.pickitem.sel{border-color:var(--grape);background:var(--grape-soft);box-shadow:0 0 0 3px rgba(91,75,214,.16)}
.pickitem.sel .nm{color:var(--grape-dark)}
.pickscroll{max-height:34vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px}
/* A sheet slid up from the bottom of a screen held on its side is a
   letterbox. On its side it becomes a dialog in the middle instead, with
   all four corners rounded, and the list inside it gets more of the
   little height there is. */
html[data-o="wide"] .sheet{align-items:center}
html[data-o="wide"] .sheet .inner{border-radius:var(--r-xl)}
html[data-o="wide"] .pickscroll{max-height:42vh}
/* the world picker: a strip of landscapes, because a world is something
   you look at rather than a word you read */
.worldgrid{display:flex;flex-direction:column;gap:9px}
.pickworld{display:flex;align-items:center;gap:12px;text-align:left;padding:8px;
  border-radius:var(--r-m);border:2px solid var(--line);background:var(--paper)}
.pickworld .thumb{width:82px;height:46px;flex:none;border-radius:10px;overflow:hidden;
  position:relative;border:2px solid rgba(24,37,67,.12);background:#1a2440}
.pickworld .thumb svg{position:absolute;inset:0;width:100%;height:100%}
.pickworld .nm{font-family:var(--font-display);font-size:calc(16px * var(--tx));display:block;line-height:1.15}
.pickworld .sub{font-size:calc(12.5px * var(--tx));color:var(--ink-soft);font-weight:700;display:block}
.pickworld.sel{border-color:var(--grape);background:var(--grape-soft);box-shadow:0 0 0 3px rgba(91,75,214,.16)}

/* ---------- workshop ----------
   The race screen is dark, loud and moving. This one is deliberately
   none of those: warm paper, nothing animated, nothing counting down.
   The child should be able to tell which mode they are in from across
   the room. */
.chip.cool{background:#eef0ff;border-color:#c9cfff;color:#3b3a8f}
.place.shopplace{background:linear-gradient(160deg,#fff6e6,#ffe9c9);border-color:#f0cf95}
.shopthumb{display:grid;place-items:center;font-size:34px;background:#ffdfa8 !important}
.place.shopplace .foot{color:#8a5a00}

.shop{background:#fdf7ee}
.jobs{display:flex;flex-direction:column;gap:12px;padding:8px 18px 0}
.job{
  display:flex;gap:14px;align-items:center;text-align:left;background:var(--paper);
  border:2px solid var(--line);border-radius:var(--r-l);padding:12px;box-shadow:var(--shadow);
}
.job:active{transform:translateY(2px)}
.job .jobpic{width:62px;height:62px;flex:none;border-radius:18px;background:#fff1d6;display:grid;place-items:center;font-size:32px}
.job .nm{font-family:var(--font-display);font-size:calc(18px * var(--tx));line-height:1.15;display:block}
.job .sub{font-size:calc(13px * var(--tx));color:var(--ink-soft);font-weight:700;display:block}
.pips.dark .pip{background:var(--shell-2);box-shadow:inset 0 0 0 1.5px var(--line)}
.pips.dark .pip.now{background:var(--grape);transform:scale(1.3);box-shadow:none}
.job.now{border-color:var(--mint);box-shadow:0 0 0 3px rgba(18,179,106,.14),var(--shadow)}
.atschool{display:inline-block;margin-top:5px;font-size:calc(12.5px * var(--tx));font-weight:800;letter-spacing:.3px;
  text-transform:uppercase;color:var(--mint-dark);background:#dff7ea;border-radius:999px;padding:3px 9px}

.jobask{
  font-family:var(--font-display);font-size:calc(var(--tx) * clamp(19px,5.4vw,24px));line-height:1.3;
  text-wrap:balance;text-align:center;padding:16px 18px 10px;
}
/* The round window above the counter. It is the only thing on this
   screen that changes as the work goes on, so it stands alone and
   centred rather than sharing a line with anything. */
.revealbox{display:flex;justify-content:center;padding:2px 18px 10px}
.reveal{width:clamp(76px,20vw,104px);height:clamp(76px,20vw,104px);display:block}

/* The counter: what the child has put down so far. It grows downwards
   rather than scrolling sideways, so nothing already laid out can slip
   out of sight while more is being added. */
.counter{
  margin:0 18px;min-height:86px;border-radius:var(--r-l);background:var(--paper);
  border:3px dashed var(--line);padding:10px;display:flex;flex-wrap:wrap;gap:6px;
  align-items:center;justify-content:center;
}
.counter-empty{color:var(--ink-soft);font-size:calc(14.5px * var(--tx));font-weight:700}
.counter-sum{
  margin-left:6px;font-family:var(--font-display);font-size:calc(22px * var(--tx));font-variant-numeric:tabular-nums;
  background:var(--grape-soft);color:var(--grape-dark);border-radius:999px;padding:4px 14px;
}
.putcoin{width:44px;height:44px;display:block}
.putcoin.small{width:36px;height:36px;display:inline-block}
.putcoin .coin,.traycoin .coin{width:100%;height:100%;display:block}
.jobhint{min-height:46px;text-align:center;font-size:calc(14.5px * var(--tx));color:var(--ink-soft);
  line-height:1.4;font-weight:700;padding:10px 18px 0}
.jobhint b{font-family:var(--font-display);font-size:calc(18px * var(--tx));color:var(--ink)}
.solrow{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.tray{
  display:grid;grid-template-columns:repeat(6,1fr);gap:7px;padding:12px 14px 14px;
}
/* one kind of part instead of six values of coin: the whole answer is
   how many times this is tapped, so it gets the room of three coins */
.tray.one{grid-template-columns:1fr;padding:10px 26%}
.tray.one .traycoin{height:clamp(56px,10vh,68px)}
/* the tray of things to count, which is the question itself */
.jobpicbox{padding:2px 18px 8px}
.parts{display:block;width:100%;height:auto;max-height:26vh}
.job.peek{border-style:dashed;opacity:.92}
.atschool.peek{color:var(--grape-dark);background:#e7e9ff}
.traycoin{height:clamp(52px,9vh,62px);border-radius:var(--r-m);background:var(--paper);
  box-shadow:0 4px 0 var(--line);display:grid;place-items:center;padding:5px}
.traycoin:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}

/* The workshop on a screen held on its side. The task, the thing to
   count and the round window go down the left; the counter, the hint,
   the coins and Done go down the right, so the child's hands stay where
   they were and nothing has to be scrolled to. A task without a picture
   simply leaves the "pic" area empty, which the grid does not mind. */
html[data-o="wide"] .shop .scr-scroll{
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  grid-template-rows:auto auto minmax(0,1fr) auto;column-gap:12px;
  grid-template-areas:"ask counter" "pic hint" "reveal tray" "reveal go";
  align-content:start;
}
.jobask{grid-area:ask} .jobpicbox{grid-area:pic} .revealbox{grid-area:reveal}
.counter{grid-area:counter} .jobhint{grid-area:hint} .tray{grid-area:tray} .jobgo{grid-area:go}
/* half a screen is narrower than a screen, so the single big part does
   not need a quarter of it as margin */
html[data-o="wide"] .tray.one{padding:10px 18%}
/* the list of pieces of work has room for two columns on its side */
html[data-o="wide"] .jobs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}

@media (max-height:660px){
  .counter{min-height:72px}
  .reveal{width:64px;height:64px}
  .revealbox{padding:0 18px 6px}
  .putcoin{width:38px;height:38px}
  /* a cap, not a fixed height: a fixed one overrode the aspect ratio and
     left dark bars beside the scene. It is a share of the height rather
     than a number of pixels, so a 500 px window and a 660 px one both
     leave the same room for the question and the keypad. */
  .stage{max-height:36vh}
  /* the long lines have to be repeated here, class for class: a bare
     `.question` is one class deep and loses to the two class rules for
     `.q-long` and `.q-xlong` above, so without these a short screen
     would step every question down except the ones that need it most */
  .question{font-size:calc(var(--tx) * clamp(32px,10vw,44px))}
  .question.q-long{font-size:calc(var(--tx) * clamp(26px,7.2vw,36px))}
  .question.q-xlong{font-size:calc(var(--tx) * clamp(21px,5.6vw,30px))}
  .answerbox{height:52px;font-size:calc(34px * var(--tx));min-width:calc(92px * var(--tx))}
  .question .unit{font-size:calc(22px * var(--tx))}
  /* A short screen is where the keypad and the question fight over the
     same pixels. The key still grows with its digit, but from a lower
     floor: at 44 px the first year's keypad is the height everybody
     else's is, which leaves the question the 137 px it needs instead of
     119, and the digit is still 32.5 px in a key of 55. */
  .key{min-height:calc(44px * var(--tx))}
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>

<body>
<div id="app"></div>
<script>
/* ------------------------------------------------------------------ *
 * Translations. Every user facing string lives here.
 * Placeholders are {0}, {1}, ... and are filled by t().
 * ------------------------------------------------------------------ */
const I18N = {

cs: {
  appName: "Počtářský závod",
  tagline: "Trénink násobilky, který se hraje jako závod",

  /* language picker */
  langParent: "Jazyk rodičovské sekce",
  langChild: "Jazyk pro hráče {0}",

  /* parent code */
  pinTitle: "Rodičovský kód",
  pinTitleChange: "Změna kódu",
  pinSub: "Zadejte kód, kterým se dostanete do nastavení",
  pinSubChange: "Zadejte nový kód",
  pinInfo: "Kód chrání nastavení a přehled výsledků. Dítě ho znát nemá. Není to bezpečnostní zámek, jen zábrana proti zvědavým prstům.",
  pinPlaceholder: "kód",
  pinSave: "Uložit kód",
  pinBack: "Zpátky",
  pinTooShort: "Kód musí mít čtyři až šest číslic.",
  gateTitle: "Pro rodiče",
  gateHeading: "Tahle část je pro dospělé",

/* ------------------------------------------------------------------ *
 * Curricula: the sequence layer.
 *
 * The topic catalogue (what the game can generate) lives in the engine.
 * This file only says, for one textbook series, which chapters come in
 * which order and which facts belong to each. Adding another textbook
 * means adding an entry here, not writing generators.
 *
 * Chapter names stay in the language of the textbook. A Czech series
 * has Czech chapter names whatever language the interface is set to,
 * because that is what the parent reads on the cover.
 *
 * `pool` is null for a chapter whose topic the game cannot generate yet.
 * Such a chapter is still listed, so the parent can set where the class
 * actually is, but it produces no race of its own.
 *
 * pool fields:
 *   mult  [tables]                multiplication facts touching those tables
 *   div   [tables]                division facts touching those tables
 *   as20  {maxSum, carry, addend} addition and subtraction within 20
 *                                 carry: "yes" crosses a ten, "no" never
 *                                 does, which still allows 13 + 4
 *                                 addend: one of the two addends is in the list
 *   as100 [bucket ids]            h1..h5, the difficulty buckets within 100
 *   as1000 [bucket ids]           b1..b6, the steps into the thousand,
 *                                 from whole hundreds to crossing one
 *   multBeyond [bucket ids]       1..4, multiplying past the times table,
 *   divBeyond  [bucket ids]       and the same examples read backwards.
 *                                 The two are separate fields because the
 *                                 book teaches them as separate chapters
 *   multTens [bucket ids]         1..2, multiplying by ten, by a hundred
 *   divTens  [bucket ids]         and by a round ten, and the same
 *                                 products read backwards. Two fields
 *                                 for the same reason as past the tables
 *   units [bucket ids]            1..4, converting units by the kind of
 *                                 measure: length, weight, volume, time.
 *                                 One field, unlike past the tables: a
 *                                 chapter that converts converts both ways
 *   round [bucket ids]            o1..o3, rounding: tens under a hundred,
 *                                 tens of a three digit number, hundreds
 *   chain [bucket ids]            1..3, three numbers and two signs,
 *                                 within twenty, whole tens, the hundred
 *   ops   [bucket ids]            1..4, which operation goes first:
 *                                 plain and then bracketed, first inside
 *                                 a hundred and then inside a thousand
 *   clock [bucket ids]            c1..c6, telling the time by precision,
 *                                 c6 being the afternoon 24 hour reading
 *   variant "missing"             not a pool but a shape: the chapter
 *                                 asks for its material with the first
 *                                 number hidden, "▢ × 7 = 42". The keys
 *                                 stay exactly as they are, so this is
 *                                 the same learning asked backwards and
 *                                 not a second set of facts
 *   shop  [job ids]               workshop jobs, for material that is
 *                                 reasoning rather than recall. A chapter
 *                                 with only these is pickable but puts no
 *                                 track on the map.
 *
 * Source of the sequences: docs/kurikulum/. Structure only, no content.
 * ------------------------------------------------------------------ */

"use strict";
/* =================================================================
   1. LANGUAGE
   The parent section and every player profile can run in a different
   language. render() decides which one applies to the screen it draws.
   ================================================================= */
const FALLBACK_LANG = "en";
const PARENT_VIEWS = ["setpin", "gate", "parent", "players"];
let CUR_LANG = FALLBACK_LANG;
/* Which world the words come from, empty for the parent section. A world
   renames only the handful of things that read wrong in it: nobody
   drives along a forest trail. The dictionary therefore holds just the
   words that really differ, under `w_<world>_<key>`, and everything else
   falls through to the plain key instead of being copied four times. */
let CUR_WORLD = "";

function detectLang(){
  const wanted = (navigator.languages || [navigator.language || ""])
    .map(l => String(l).slice(0, 2).toLowerCase());
  for(const l of wanted) if(I18N[l]) return l;
  return FALLBACK_LANG;
}
function t(key){
  const dict = I18N[CUR_LANG] || I18N[FALLBACK_LANG];
  let s = CUR_WORLD ? dict["w_" + CUR_WORLD + "_" + key] : undefined;
  if(s === undefined) s = dict[key];
  if(s === undefined) s = I18N[FALLBACK_LANG][key];
  if(s === undefined) return key;
  for(let i = 1; i < arguments.length; i++) s = s.split("{" + (i-1) + "}").join(arguments[i]);
  return s;
}
/* Decimal separator follows the interface language, not the browser locale. */
function num(x, decimals){
  const s = Number(x).toFixed(decimals === undefined ? 0 : decimals);
  return CUR_LANG === "en" ? s : s.replace(".", ",");
}
function applyLang(){
  const p = P();
  const parent = PARENT_VIEWS.indexOf(view.name) >= 0;
  CUR_LANG = parent
    ? (DB.lang || FALLBACK_LANG)
    : ((p && p.lang) || DB.lang || FALLBACK_LANG);
  // the parent section talks about the game, not from inside it, so it
  // keeps the plain words whatever world the child is playing in
  CUR_WORLD = (!parent && p && p.world) ? p.world : "";
  try{ document.documentElement.lang = CUR_LANG; }catch(e){}
}
/* The school year picker, the same control in the new player sheet and
   in the parent section. Nothing before the first year and nothing past
   the fourth: the game has no material for either. */
function gradeSeg(act, current){
  return `<div class="seg">` + [1,2,3,4].map(function(g){
    return `<button class="${current === g ? "on" : ""}" data-act="${act}" data-gr="${g}">${t("grade" + g)}</button>`;
  }).join("") + `</div>`;
}
function langSeg(act, current){
  return `<div class="seg">` + LANGS.map(function(l){
    return `<button class="${current === l[0] ? "on" : ""}" data-act="${act}" data-lang="${l[0]}">${l[1]}</button>`;
  }).join("") + `</div>`;
}

/* =================================================================
   2. STORAGE
   Everything lives in one localStorage entry. There is no server.
   ================================================================= */
const KEY = "math-fact-racer-v1";
let DB = { profiles: [], current: null, sound: true, lang: null };

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) DB = Object.assign(DB, JSON.parse(raw));
  }catch(e){ /* first run, or storage blocked by the browser */ }
  DB.profiles = DB.profiles || [];
  DB.lang = DB.lang || detectLang();
  for(const p of DB.profiles){
    // the free starter set belongs to everyone, including older profiles
    p.owned = p.owned || [];
    for(const s of STARTERS) if(!p.owned.includes(s)) p.owned.push(s);
    if(!p.runner || !p.owned.includes(p.runner)) p.runner = STARTERS[0];
    p.lang = p.lang || DB.lang;
    // curriculum choice, added later: older profiles stay adaptive
    if(p.curriculum === undefined) p.curriculum = null;
    if(p.chapter === undefined) p.chapter = null;
    p.chapterMode = p.chapterMode || "soft";
    // a curriculum that no longer exists must not strand the profile
    if(p.curriculum && !curriculumById(p.curriculum)){ p.curriculum = null; p.chapter = null; }
    if(p.curriculum) normalizeChapter(p);
    seedOpened(p);
    seedShop(p);
    seedDuck(p);
    seedStars(p);
    seedWorld(p);
    seedGrade(p);
    seedBands(p);
  }
}
/* What goes on the duck, added later. An older profile knows none of it
   and starts with an empty wardrobe; it loses nothing by that, because a
   duck with no body chosen is the classic yellow one, which is what it
   was already looking at. */
function seedDuck(p){
  p.duckParts = p.duckParts || [];   // duck part ids bought with parts
  p.duck      = p.duck      || {};   // layer -> the part id worn on it
}
/* The workshop, added later. An older profile has none of this and must
   simply start with an empty toolbox; nothing it already owns is touched. */
function seedShop(p){
  if(typeof p.parts !== "number") p.parts = 0;
  p.paints  = p.paints  || [];     // paint ids bought with parts
  p.paint   = p.paint   || {};     // machine id -> paint id currently on it
  p.jobRuns = p.jobRuns || {};     // workshop job id -> pieces of work finished
}
/* The collection, added later. A place lights up when a fact reaches
   level four and never goes dark again, so it cannot be derived from
   the box: a fact that was forgotten is back at level one while its
   place has to stay lit. An older profile has no record of what it once
   knew, so the best it can be given is what it knows right now. */
function seedStars(p){
  p.stars = p.stars || {};
  for(const k of Object.keys(p.facts || {})) if(p.facts[k].lv >= STAR_LV) p.stars[k] = true;
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){}
}
function P(){ return DB.profiles.find(p => p.id === DB.current) || null; }

/* A new profile is told which school year the child is in, because that
   is what decides how much of the map is laid out in front of them. An
   older profile, and an imported backup from before this existed, has no
   year and gets the top one, which is what it was already seeing. */
function newProfile(name, grade){
  return {
    id: "p" + Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    name: name,
    lang: DB.lang || FALLBACK_LANG,
    facts: {},          // fact key -> {lv, reps, ok, bad, best, seen}
    stars: {},          // fact key -> true once it has ever reached level 4
    best: {},           // track id -> best run {dist, hist, n0}
    done: {},           // track id -> best medal 0..3
    owned: STARTERS.slice(),
    runner: STARTERS[0],
    xp: {},             // collectible id -> experience
    coins: 0,
    parts: 0,           // workshop currency, cannot be earned by racing
    paints: [],         // paint ids bought with parts
    paint: {},          // machine id -> paint id currently on it
    duckParts: [],      // duck part ids bought with parts, never given back
    duck: {},           // duck layer -> the part id worn on it
    jobRuns: {},        // workshop job id -> pieces of work finished
    trackRuns: {},      // track id -> races completed
    opened: {},         // track id -> true once it has ever been unlocked
    force: {},          // parent override: track id -> true/false
    autoUnlock: true,
    qCount: 20,
    speedMode: "normal",// slow | normal | fast (fast answer threshold)
    curriculum: null,   // curriculum id, or null for the adaptive default
    chapter: null,      // chapter number inside that curriculum
    chapterMode: "soft",// soft keeps spaced review, hard drills the chapter only
    world: "circuit",   // the coat the game wears; never changes difficulty
    grade: (grade >= 1 && grade <= MAX_GRADE) ? grade : MAX_GRADE,
    streak: 0, lastDay: null, bestStreak: 0,
    runs: 0, totalOk: 0, totalAns: 0, msSum: 0, msN: 0,
    created: Date.now()
  };
}

function today(){ const d = new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function touchStreak(p){
  const t = today();
  if(p.lastDay === t) return false;
  const y = new Date(); y.setDate(y.getDate()-1);
  const yk = y.getFullYear()+"-"+(y.getMonth()+1)+"-"+y.getDate();
  p.streak = (p.lastDay === yk) ? p.streak + 1 : 1;
  p.lastDay = t;
  if(p.streak > p.bestStreak) p.bestStreak = p.streak;
  return true;
}

/* =================================================================
   3. QUESTIONS
   55 unique multiplication facts (commutative pairs collapsed), the
   same for addition within 20, and five difficulty buckets each for
   addition and subtraction within 100.
   ================================================================= */
const MULT = [];
for(let a=1; a<=10; a++) for(let b=a; b<=10; b++) MULT.push({a,b});   // 55 facts

/* Addition within twenty is not only single digit plus single digit.
   The whole of the first grade is spent on the teens without ever
   crossing a ten, so 13 + 4 has to be a fact of its own; the old key
   space could not even write it down. A teen fact is stored the same
   way as any other, larger number second, so 13 + 4 is a4p13 and the
   generator needs no special case at all. */
const ADD = [];
for(let a=1; a<=10; a++) for(let b=a; b<=10; b++) ADD.push({a,b});    // sums within 20
for(let teen=11; teen<=19; teen++) for(let d=1; d<=9-(teen%10); d++) ADD.push({a:d, b:teen});

/* Crossing a ten is what makes an addition hard, and it happens when
   the units alone add up past ten. Written this way the rule holds for
   6 + 7, for 13 + 4 and for 10 + 7 alike, and making a whole ten does
   not count as crossing one. */
const crossesTen = (a,b) => (a % 10) + (b % 10) > 10;

/* The first year is not one skill and not one track. The books add one
   number at a time and practise everything inside the range they have
   reached: to three, to five, to seven, to ten, then the teens without
   ever leaving the ten, first to fifteen and then to twenty. A child in
   the first weeks has no business meeting 20 - 10, and putting the whole
   of the first year behind one door did exactly that.
   Each range is therefore a place of its own, and it holds only the
   facts it introduces; everything earlier comes back as review through
   the Leitner box, the same shape as every other track here.
   The ranges are read off the first year map in docs/kurikulum. */
const BANDS = [
  {id:"a3",  lo:2,  hi:3},
  {id:"a5",  lo:4,  hi:5},
  {id:"a7",  lo:6,  hi:7},
  {id:"a10", lo:8,  hi:10},
  {id:"a15", lo:11, hi:15},
  {id:"a20", lo:16, hi:20}
];
const inBand = (b, f) => !crossesTen(f.a, f.b) && (f.a + f.b) >= b.lo && (f.a + f.b) <= b.hi;
function bandKeys(id){
  const b = BANDS.find(x => x.id === id) || BANDS[0];
  const out = [];
  for(const f of ADD) if(inBand(b, f)) out.push(ak(f.a,f.b), sk(f.a,f.b));
  return out;
}

/* Crossing the ten is not one skill but four, and they are not equally
   hard. Making ten from a nine is the easiest bridge and gets taught
   first, then eight, then seven, then the rest. The order is lifted from
   Matyskova matematika part four, which devotes a whole chapter to each.
   A fact belongs to the stage of its larger addend, which is the chapter
   where the book first teaches it. The whole of it is second year work,
   which is why it is a track of its own and not the tail of the first
   year's ladder. */
const E_STAGES = [
  {id:"e3", has:(a,b) => crossesTen(a,b) && Math.max(a,b) === 9},
  {id:"e4", has:(a,b) => crossesTen(a,b) && Math.max(a,b) === 8},
  {id:"e5", has:(a,b) => crossesTen(a,b) && Math.max(a,b) === 7},
  {id:"e6", has:(a,b) => crossesTen(a,b) && Math.max(a,b) <= 6}
];

const H_BUCKETS = [
  {id:"h1", label:"two digit plus one digit, no carry"},
  {id:"h2", label:"one digit crossing the ten"},
  {id:"h3", label:"round tens"},
  {id:"h4", label:"two digit plus two digit, no carry"},
  {id:"h5", label:"two digit plus two digit with a carry"}
];

/* Within a thousand the book splits the work twice over: by what is
   being added, a single digit, whole tens, or a two digit number, and
   by whether the hundred has to be crossed. That is six steps, and the
   eighth part spends twenty pages walking through them in this order,
   so the buckets are staged like the bridges over ten rather than drawn
   from one bag: the child meets whole hundreds first and carrying into
   the next hundred last. */
const K_BUCKETS = [
  {id:"b1", label:"whole hundreds"},
  {id:"b2", label:"three digit plus one digit, no carry"},
  {id:"b3", label:"three digit plus one digit crossing the ten"},
  {id:"b4", label:"three digit plus whole tens"},
  {id:"b5", label:"three digit plus two digit, within the hundred"},
  {id:"b6", label:"three digit plus two digit crossing the hundred"}

/* Telling the time is not one skill either. The book adds precision one
   step at a time and returns to it every few chapters all through the

   minute positions it introduces, and everything earlier comes back as

/* Past the times table. The seventh part spends four pages on
   multiplying a two digit number by a one digit one and four more on
   reading it backwards as division, and the eighth part takes the same

const X_BUCKETS = [

/* Three numbers and two signs, the first question with more than one
   step. The book takes it in the seventh part, still under a hundred,
   right after the buckets within a hundred, so the ranges follow those:
   within twenty, whole tens, and the mixed hundred. Every intermediate
   result stays inside the bucket's range and above zero, so the child
   never meets a negative number on the way to the answer. */
const Q_BUCKETS = [
  {id:"1", label:"three one digit numbers within twenty"},   // 7 + 5 - 3
  {id:"2", label:"whole tens within a hundred"},             // 30 + 40 - 20
  {id:"3", label:"two digit, one digit and tens within a hundred"}  // 47 + 5 - 3
];
const chainKeys = ids => ids.map(b => "q" + b);
// the four patterns a pair of signs can take, drawn evenly
const Q_SIGNS = ["++", "+-", "-+", "--"];

/* Which of two operations is done first. Chapter 13 of the seventh part

   comes back to it with bigger numbers, so the four buckets run along
   two axes: brackets or none, and within a hundred or within a
   thousand.

   division comes out even. The track opens on the table alone, and
   nothing in the game has taught a child 360 : 4 yet; that is the

   down, because it is why the fourth bucket looks different from the
   second: an expression whose outer operation is × or : cannot leave
   the hundred while the table is the limit, so the fourth bucket grows
   the range on the adding side and its brackets are the kind that
   really change the answer, a - (b + c). Read left to right that line
   comes out differently, which is the whole lesson. */
const Z_BUCKETS = [
  {id:"1", label:"no brackets, within a hundred"},    // 4 + 3 × 5
  {id:"2", label:"brackets, within a hundred"},       // (4 + 3) × 5
  {id:"3", label:"no brackets, within a thousand"},   // 300 + 7 × 8
  {id:"4", label:"brackets, within a thousand"}       // 500 - (40 + 30)

const opsKeys = ids => ids.map(b => "z" + b);

/* Ten, a hundred, and the round tens that follow from them. The eighth
   part gives four pages to multiplying and dividing by ten and by a
   hundred and lets the round tens fall straight out of it: 3 × 40 is

   bare nought first and then a table fact wearing one.
   Dividing is the same product read backwards, so one bucket trains
   both directions, exactly as past the tables does; the key says which
   way round it is, `gm` or `gd`, and the bucket id is a plain number,
   which is the convention that family set. */
const G_BUCKETS = [
  {id:"1", label:"times and divided by ten and a hundred"},
  {id:"2", label:"times and divided by a round ten"}
];
const tensKeys = ids => ids.map(b => "gm" + b).concat(ids.map(b => "gd" + b));

/* Converting units, one bucket per kind of measure. The seventh part
   introduces length, weight and volume (chapter 17) and then the clock
   and the calendar (chapter 18), and the eighth part converts them
   (chapter 29), so time is a bucket of its own and the other three are
   one each.
   Every pair is written big unit, small unit, how many of the small
   ones go into the big one, and both directions come out of the same
   pair: the generator either multiplies or divides by that number.
   Only conversions the books actually ask for are here; a metre into
   millimetres is arithmetically fine and pedagogically nowhere. */
const U_BUCKETS = [
  {id:"1", pairs:[["m","cm",100], ["km","m",1000], ["dm","cm",10], ["cm","mm",10]]},
  {id:"2", pairs:[["kg","g",1000], ["t","kg",1000]]},

   so they stand in the table above as they are. The spoken ones do not,
   and Czech needs three forms of each: one day, two to four days, five

   the number picks one; English and German split the same way and
   simply repeat their plural. */

  if(U_WORDS.indexOf(u) < 0) return u;
  const forms = t("unit_" + u).split("|");
  return forms[n === 1 ? 0 : n < 5 ? 1 : 2] || forms[forms.length - 1];

const FIVES = [0,5,10,15,20,25,30,35,40,45,50,55];
